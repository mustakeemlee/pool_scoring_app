_format_version: "2.1"
services:
  - name: auth-v1-open
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-open
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors
  - name: auth-v1-open-callback
    url: http://auth:9999/callback
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors
  - name: auth-v1-open-authorize
    url: http://auth:9999/authorize
    routes:
      - name: auth-v1-open-authorize
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
  - name: functions-v1-enter-match
    url: http://fn-enter-match:9000/
    routes:
      - name: functions-v1-enter-match-all
        strip_path: true
        paths:
          - /functions/v1/enter-match
    plugins:
      - name: cors
  - name: functions-v1-correct-match
    url: http://fn-correct-match:9000/
    routes:
      - name: functions-v1-correct-match-all
        strip_path: true
        paths:
          - /functions/v1/correct-match
    plugins:
      - name: cors
  - name: functions-v1-close-week
    url: http://fn-close-week:9000/
    routes:
      - name: functions-v1-close-week-all
        strip_path: true
        paths:
          - /functions/v1/close-week
    plugins:
      - name: cors
  - name: functions-v1-start-season
    url: http://fn-start-season:9000/
    routes:
      - name: functions-v1-start-season-all
        strip_path: true
        paths:
          - /functions/v1/start-season
    plugins:
      - name: cors
