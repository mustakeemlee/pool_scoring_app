server {
    listen 80;
    root /usr/share/nginx/html;

    # Player photo uploads go through this proxy.
    client_max_body_size 10m;

    location / {
        try_files $uri /index.html;
    }

    # Same-origin API proxy: the frontend is built with an empty
    # VITE_SUPABASE_URL, so supabase-js talks to window.location.origin and
    # these locations forward to the Kong gateway inside the compose network.
    # This means only port 8080 needs to be reachable from the LAN, and the
    # app keeps working even if the host machine's IP changes.
    location ~ ^/(rest|auth|storage|functions)/v1/ {
        proxy_pass http://kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
