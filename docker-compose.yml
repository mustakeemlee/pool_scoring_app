services:
  db:
    image: public.ecr.aws/supabase/postgres:17.6.1.143
    restart: unless-stopped
    environment:
      POSTGRES_USER: supabase_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTHENTICATOR_DB_PASSWORD: ${AUTHENTICATOR_DB_PASSWORD}
      SERVICE_ROLE_DB_PASSWORD: ${SERVICE_ROLE_DB_PASSWORD}
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "supabase_admin", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./docker/db-init/zz-set-role-passwords.sh:/docker-entrypoint-initdb.d/zz-set-role-passwords.sh:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.192.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_EXTERNAL_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://supabase_auth_admin:${AUTH_DB_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_APP_URL:-http://localhost:8080},${PUBLIC_APP_URL:-http://localhost:8080}/admin/reset-password,http://localhost:8080,http://localhost:8080/admin/reset-password
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rest:
    image: public.ecr.aws/supabase/postgrest:v14.14
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgresql://authenticator:${AUTHENTICATOR_DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_MAX_ROWS: "1000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kong:
    image: public.ecr.aws/supabase/kong:2.8.1
    restart: unless-stopped
    depends_on:
      - auth
      - rest
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
    volumes:
      - ./docker/kong.yml:/home/kong/kong.yml:ro
    ports:
      - "127.0.0.1:8000:8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Empty on purpose: the frontend nginx proxies /rest, /auth, /storage
        # and /functions to Kong on the SAME origin, so the app works from any
        # device on the LAN regardless of this machine's IP.
        VITE_SUPABASE_URL: ""
        VITE_SUPABASE_ANON_KEY: ${ANON_KEY}
    restart: unless-stopped
    ports:
      - "8080:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  storage:
    image: public.ecr.aws/supabase/storage-api:v1.67.5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://supabase_storage_admin:${STORAGE_DB_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: pool-league
      REGION: local
      GLOBAL_S3_BUCKET: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fn-enter-match:
    image: public.ecr.aws/supabase/edge-runtime:v1.74.2
    restart: unless-stopped
    command: ["start", "--main-service", "/functions/enter-match", "--port", "9000"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://service_role:${SERVICE_ROLE_DB_PASSWORD}@db:5432/postgres
    volumes:
      - ./supabase/functions:/functions:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fn-correct-match:
    image: public.ecr.aws/supabase/edge-runtime:v1.74.2
    restart: unless-stopped
    command: ["start", "--main-service", "/functions/correct-match", "--port", "9000"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://service_role:${SERVICE_ROLE_DB_PASSWORD}@db:5432/postgres
    volumes:
      - ./supabase/functions:/functions:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fn-close-week:
    image: public.ecr.aws/supabase/edge-runtime:v1.74.2
    restart: unless-stopped
    command: ["start", "--main-service", "/functions/close-week", "--port", "9000"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://service_role:${SERVICE_ROLE_DB_PASSWORD}@db:5432/postgres
    volumes:
      - ./supabase/functions:/functions:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fn-start-season:
    image: public.ecr.aws/supabase/edge-runtime:v1.74.2
    restart: unless-stopped
    command: ["start", "--main-service", "/functions/start-season", "--port", "9000"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://service_role:${SERVICE_ROLE_DB_PASSWORD}@db:5432/postgres
    volumes:
      - ./supabase/functions:/functions:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  storage-data:
