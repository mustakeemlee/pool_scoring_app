services:
  db:
    image: public.ecr.aws/supabase/postgres:17.6.1.143
    environment:
      POSTGRES_USER: supabase_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "supabase_admin"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./docker/db-init/zz-set-role-passwords.sh:/docker-entrypoint-initdb.d/zz-set-role-passwords.sh:ro
